[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeztrace"
version = "0.2.0.dev0"
description = "A dependency-free, lightweight Python tracing and logging library"
readme = "README.md"
authors = [{ name = "Jefferson Nelsson", email = "jefferson.nelsson@gmail.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
keywords = ["logging", "tracing", "monitoring", "debugging", "performance"]
dependencies = []
requires-python = ">=3.9"

[project.urls]
Homepage = "https://jeffersonaaron25.github.io/PyEzTrace/"
Documentation = "https://jeffersonaaron25.github.io/PyEzTrace/"
Source = "https://github.com/jeffersonaaron25/PyEzTrace"
Issues = "https://github.com/jeffersonaaron25/PyEzTrace/issues"

[project.scripts]
pyeztrace = "pyeztrace.cli:main"

[tool.setuptools.packages.find]
include = ["pyeztrace*"]
exclude = ["tests*"]

[project.optional-dependencies]
# Keep default install dependency-free. Users can opt-in to extras below.
openai = ["openai>=3.13.0"]
anthropic = ["anthropic>=1.5.0"]
langchain = ["langchain-core>=1.6.3"]
llm = ["pyeztrace[openai,anthropic,langchain]"]
otel = [
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
]
gcp = [
    "google-auth>=2.23.0",
]
s3 = [
    "boto3>=1.28.0",
]
azure = [
    "azure-storage-blob>=12.14.0",
]
all = [
    "pyeztrace[otel,gcp,s3,azure]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Start with syntax/control-flow correctness; defer broad style churn.
select = ["E9", "F63", "F7", "F82"]
