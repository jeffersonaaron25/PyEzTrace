name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .[all] pytest pytest-asyncio coverage "ruff==0.16.7"

      - name: Check Python correctness
        run: ruff check pyeztrace tests

      - name: Run tests
        run: coverage run --branch --source=pyeztrace -m pytest

      - name: Enforce coverage floor
        run: coverage report --fail-under=60

      - name: Publish coverage summary
        if: always()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compile package
        run: python -m compileall -q pyeztrace

  llm-integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional SDKs and test tools
        run: python -m pip install -e '.[llm]' pytest pytest-asyncio pip-audit
      - name: Test SDK adapters with synthetic transports
        run: python -m pytest -q tests/test_llm.py tests/test_llm_sdks.py
      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable
